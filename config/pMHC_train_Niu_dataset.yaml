experiment:
  name: AdaMCR-KAN-MHC_train
  description: Train MHC with Niu dataset
  tags:
    - AdaMCR-KAN

data:
  pmhc_train: ../data/pmhc_train.csv
  pmhc_test: ../data/pmhc_test.csv
  vocab: vocab_dict.npy
  pep_max_len: 25
  hla_max_len: 34

train:
  batch_size: 1024
  epochs: 18
  learning_rate: 0.001
  k_folds: 5

model:
  d_model: 192
  d_k: 64
  d_v: 64
  n_layers: 2
  n_heads: 8
  dropout: 0.1
  mkan_order: 3
  cnn_kernel_size: 3

eval:
  threshold: 0.5