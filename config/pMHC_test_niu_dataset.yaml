experiment:
  name: AdaMCR-KAN-MHC_test
  description: Test MHC with selected Best_model.pkl
  tags:
    - AdaMCR-KAN
    - test

data:
  pmhc_test: ../data/pmhc_test.csv
  vocab: vocab_dict.npy
  pep_max_len: 25
  hla_max_len: 34

model:
  module_name: AdaMCR_KAN

  pkl_path: "/home/AdaMCR-KAN/model/MHC/AdaMCR-KAN_RUN_2026-07-17_22-05-27-niu-dataset/Best_model.pkl"


  d_model: 192
  d_k: 64
  d_v: 64
  n_layers: 2
  n_heads: 8
  dropout: 0.1
  mkan_order: 3
  cnn_kernel_size: 3

test:
  batch_size: 1024
  threshold: 0.5
  output_dir: ../result/mhc-test
  output_name: pmhc_result.csv
  compute_metrics: true

  metric_mode: train_test

  strict_load: true
  random_seed: 1234